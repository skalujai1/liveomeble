# Doradca wnętrz Liveo – Cloudflare Worker (widżet → Worker → OpenRouter).
# Deploy: GitHub Actions (.github/workflows/deploy-doradca.yml) albo `npx wrangler deploy` z tego katalogu.
# Sekret (NIE wpisywać tutaj): OPENROUTER_API_KEY → `npx wrangler secret put OPENROUTER_API_KEY`.
name = "liveo-doradca"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Strony, z których widżet może pytać Workera (oddzielone przecinkami, bez ukośnika na końcu).
ALLOWED_ORIGINS = "https://liveomeble.pl,https://www.liveomeble.pl,https://liveo-podglad.pages.dev,http://localhost:4321,http://localhost:5180"
SITE_URL = "https://liveomeble.pl"
# Kolejność modeli (pierwszy główny, kolejne zapasowe). Tylko płatne – bez ":free".
MODELS = "google/gemini-2.5-flash-lite,meta-llama/llama-3.3-70b-instruct,google/gemini-2.0-flash-001"
# Opcjonalnie: aktualna baza wiedzy ze strony (cache 5 min). Puste = wersja z paczki (data/wiedza.txt).
KNOWLEDGE_URL = ""

[observability]
enabled = true
