<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liveo – przeliczanie wektorów</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #1d1d1b; background: #fff; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #1d1d1b; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  progress { width: 100%; height: 8px; }
  code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
  #log { white-space: pre-wrap; background: #f6f6f6; padding: 12px; border-radius: 8px; min-height: 3em; }
</style>
</head>
<body>
<h1>Przeliczanie wektorów opisów</h1>
<p>Uruchom po każdej zmianie <code>widget/prompts.js</code>. Wynik trafia do <code>data/text-embeddings.json</code>
   (wymaga lokalnego serwera: <code>python3 server.py</code>).</p>
<p><button id="run">Przelicz i zapisz</button></p>
<progress id="bar" max="1" value="0"></progress>
<div id="log"></div>
<script type="module">
  import { computeTextEmbeddings, serializeEmbeddings } from '../widget/engine.js';
  const log = m => { document.querySelector('#log').textContent += m + '\n'; };
  const btn = document.querySelector('#run');
  async function run() {
    btn.disabled = true;
    try {
      log('Pobieram model tekstowy…');
      const t0 = performance.now();
      const emb = await computeTextEmbeddings({ dtype: 'fp32', onProgress: p => (document.querySelector('#bar').value = p) });
      log(`Policzono ${Object.keys(emb.scenes).length} scen i ${Object.keys(emb.styles).length} stylów w ${((performance.now() - t0) / 1000).toFixed(1)} s`);
      const res = await fetch('/__dev/save-embeddings', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                         body: JSON.stringify(serializeEmbeddings(emb)) });
      log(res.ok ? `Zapisano: ${(await res.json()).saved}` : `Błąd zapisu: ${res.status}`);
      document.body.dataset.done = res.ok ? 'ok' : 'error';
    } catch (e) {
      log('Błąd: ' + e.message);
      document.body.dataset.done = 'error';
    } finally {
      btn.disabled = false;
    }
  }
  btn.onclick = run;
  if (new URLSearchParams(location.search).has('auto')) run();
</script>
</body>
</html>
