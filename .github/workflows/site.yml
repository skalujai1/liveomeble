# Strona Liveo — testy danych i build z kontrolą dist/ (JSON-LD, FAQ, nagłówki, linki, sitemap).
# Bez wdrożenia: hosting wybierzemy osobno (docs/navireo-integracja.md).
name: Strona – build i kontrola

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja
        run: npm ci

      # Zdjęcia katalogu (public/katalog) pobierane z serwera Liveo przez tools/data/fetch-images.mjs —
      # w cache, żeby nie pobierać ~2 tys. plików przy każdym buildzie. Klucz: karty produktu.
      - name: Zdjęcia katalogu (cache)
        uses: actions/cache@v4
        with:
          path: public/katalog
          key: katalog-${{ hashFiles('tools/data/karty-liveo.json', 'tools/data/fetch-images.mjs') }}
          restore-keys: katalog-

      - name: Testy danych
        run: npm test

      - name: Build + kontrola dist/
        run: npm run build
